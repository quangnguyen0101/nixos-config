packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false
allowBuilds:
  node-pty: true
  cloudflared: true # binary tunnel cho dsh-remote-web-ui (web-ui-all)
  cpu-features: true # optional native probe của ssh2 (web-ui-all)
  ssh2: true # SSH client cho dsh-ssh (web-ui-all)
minimumReleaseAgeExclude:
  - dsh-better-sidebar@0.15.2
  - '@linxin666/dsh-chat-recovery@0.3.0 || 0.3.2'
  - '@linxin666/dsh-client-ui-aionui-panel@0.3.0 || 0.3.2'
  - '@linxin666/dsh-client-ui-community-plugins@0.3.0 || 0.3.2'
  - '@linxin666/dsh-client-ui-git-graph@0.3.0 || 0.3.2'
  - '@linxin666/dsh-client-ui-market@0.3.0 || 0.3.2'
  - '@linxin666/dsh-client-ui-plugin-manager@0.3.0 || 0.3.2'
  - '@linxin666/dsh-client-ui-skill-explorer@0.3.0 || 0.3.2'
  - '@linxin666/dsh-client-ui-skin-center@0.3.0 || 0.3.2'
  - '@linxin666/dsh-client-ui-task-board@0.3.0 || 0.3.2'
  - '@linxin666/dsh-client-ui-web-ui-settings@0.3.0 || 0.3.2'
  - '@linxin666/dsh-desktop-launcher@0.3.0 || 0.3.2'
