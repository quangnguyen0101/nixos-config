# User patch layer cho dsh profile "web" — chạy SAU mọi bundle layer.
# Mảng YAML các loader patch entry (override config theo id, disable, insert).
- id: openviking-memory
  disabled: false
# Tắt panel Skin Center của aggregate web-ui-all (sub-plugin transitive,
