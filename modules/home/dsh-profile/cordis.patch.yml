# User patch layer cho dsh profile "web" — chạy SAU mọi bundle layer.
# Mảng YAML các loader patch entry (override config theo id, disable, insert).
- id: openviking-memory
  disabled: false
# Tắt panel Skin Center của aggregate web-ui-all (sub-plugin transitive,
# không gỡ khỏi node_modules được). Disable ở layer user để sống qua rebuild —
# toggle qua Plugin Manager UI sẽ bị template này ghi đè.
- id: web-ui-skin-center
  name: '@linxin666/dsh-client-ui-skin-center'
  disabled: true
# Lingshu (dsh-memory): override config lên row insert của bundle (bản 0.3.1 insert id "dsh-memory").
# python trỏ vào venv aeis đã cài sẵn (uv venv ~/.local/share/aeis/.venv).
- id: dsh-memory
  name: '@furongjun1999/dsh-memory'
  disabled: true
  config:
    python: !!js process.env.HOME + '/.local/share/aeis/.venv/bin/python'
    dbPath: !!js process.env.HOME + '/.local/share/lingshu/lingshu.db'
    identity: '灵枢'
    tools: 'brain'
